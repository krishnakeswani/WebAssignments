<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #main{
            height: 500px;
            width: 300px;
            
            margin: 0px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 2px;

        }
        .label{
            background-color: aqua;
            height: 20%;
            width: 100%;
            border: 1px solid black; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: cursive;
            font-size: large;
            color: crimson;
            
            
        }
        .label:hover{
            transition-duration: 2ms;
            transform: scale(1.05);
            background-image: linear-gradient(90deg, peachpuff, rgb(238, 234, 230));
            transition-timing-function: ease-out;
        }
    </style>
</head>
<body>
    <div id="main">
        <div class="label">Book a test driveeee</div>
        <div class="label">Book a test driveeee</div>
        <div class="label">Book a test driveeee</div>
        <div class="label">Book a test driveeee</div>
        <div class="label">Book a test driveeee</div>
        
    </div>
</body>
</html>
