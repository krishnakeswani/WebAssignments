<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            background-color: black;
        }
        #main{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            gap: 10px;
        }
        #one{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-image: linear-gradient(red, yellow);
            display: inline-block;
            animation-name: hi;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-duration: 1s;


        }
        #two{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-image: linear-gradient(blue, white);
            display: inline-block;
            animation-name: hi;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-duration: 1s;
            animation-delay: 0.2s;


        }#three{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-image: linear-gradient(rgb(198, 104, 119), white);
            display: inline-block;
            animation-name: hi;
            animation-direction: alternate;
            animation-iteration-count: infinite;
            animation-duration: 1s;
            animation-delay: 0.4s;
            
        }
        @keyframes hi {
            0%{
                transform: translateY(0) scale(0.8);
                opacity: 0.5;
                animation-timing-function: ease-in;
            }
            50%{
                transform: translateY(-40px) scale(1.3);
                opacity: 1;
            }
            100%{
                transform: translateY(0px) scale(1);
                opacity: 0.5;
            }
            
        }
    </style>
</head>
<body>
    <div id="main">
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    </div>

</body>
</html>
